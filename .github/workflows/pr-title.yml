name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches:
      - main

permissions: {}

jobs:
  pr-title:
    name: Check the title is a conventional commit
    runs-on: ubuntu-latest
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'
          if ! grep -qE "${pattern}" <<<"${TITLE}"; then
            echo "The title is not a conventional commit: ${TITLE}"
            echo "Use type(scope): subject, with the issue number as the scope. Example: feat(123): add null check"
            echo "type is one of feat, fix, docs, style, refactor, perf, test, build, ci, chore or revert."
            exit 1
          fi
          echo "Title is a conventional commit: ${TITLE}"
