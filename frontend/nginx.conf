# The image substitutes ${API_UPSTREAM} at startup (see frontend/Dockerfile).
server {
  listen 8080;
  root /usr/share/nginx/html;

  # Resolve the backend through Docker's DNS on each request, so a recreated
  # backend container (new IP) keeps working without restarting nginx.
  resolver 127.0.0.11 valid=10s;
  set $backend ${API_UPSTREAM};

  location /api/ {
    proxy_pass $backend;
    # The visitor's address, for the backend's per-visitor limits. Replaces any value sent in.
    proxy_set_header X-Real-IP $remote_addr;
  }
}
