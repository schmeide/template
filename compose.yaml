# Names are scoped by the Compose project (COMPOSE_PROJECT_NAME, default: the
# directory name), so several copies of this repo can run side by side.

x-postgres: &postgres
  image: postgres:18-alpine
  environment:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: app
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
    interval: 1s
    timeout: 5s
    retries: 30

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  environment:
    DATABASE_URL: postgres://postgres:postgres@db:5432/app
    PORT: "3000"

services:
  # `make up` stack: only `web` publishes a host port (WEB_PORT).
  db:
    <<: *postgres
    volumes:
      - db-data:/var/lib/postgresql

  migrate:
    <<: *backend
    command: ["node", "src/migrate.ts"]
    depends_on:
      db:
        condition: service_healthy

  backend:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 2s
      timeout: 5s
      retries: 30

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

  # `make serve`: Postgres published on DB_PORT for tsx watch on the host.
  dev-db:
    <<: *postgres
    profiles: [serve]
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - dev-db-data:/var/lib/postgresql

  # `make test`: throwaway Postgres on TEST_DB_PORT, data in memory.
  test-db:
    <<: *postgres
    profiles: [test]
    ports:
      - "${TEST_DB_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql

volumes:
  db-data:
  dev-db-data:
